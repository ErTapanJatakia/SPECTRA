name: SPECTRA npm Lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".npmrc"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spectra-lockfile-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit reproducible npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate lockfile without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
          else
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi
